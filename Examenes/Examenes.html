function loadExamRaw(examId) {
  const data = EXAM_DATA[examId];
  if (!data) return null;
  // Clona en profundidad para imitar la lectura "fresca" desde disco que
  // hacía el servidor en cada petición, aislando esta copia de cualquier
  // mutación hecha por prepareExamForRender sobre la copia usada para pintar.
  return JSON.parse(JSON.stringify(data));
}

function listExams() {
  return Object.values(EXAM_DATA)
    .map((data) => ({ id: data.id, title: data.title, description: data.description || '' }))
    .sort((a, b) => a.id.localeCompare(b.id));
}

function getExam(examId) {
  return loadExamRaw(examId);
}

// Los teclados de móvil suelen sustituir el apóstrofe recto (') por una
// comilla tipográfica (' o similares) al escribir contracciones como
// "hadn't". Sin esto, esas respuestas se marcarían como incorrectas aunque
// sean idénticas en contenido.
function normalizeApostrophes(value) {
  return String(value ?? '').replace(/[‘’ʼ´`]/g, "'");
}

function normalize(value) {
  return normalizeApostrophes(value).trim().toLowerCase().replace(/\s+/g, ' ');
}

function wordsOf(value) {
  return normalize(value).split(' ').filter(Boolean);
}

// Proporción de palabras de `a` que también aparecen en `b` (cada palabra de
// `b` solo puede usarse una vez), usada para aproximar el "medio punto" que
// Cambridge concede en key word transformation cuando la respuesta capta la
// transformación pero tiene un error menor.
function wordOverlapRatio(a, b) {
  const wordsA = wordsOf(a);
  const poolB = wordsOf(b);
  if (!wordsA.length || !poolB.length) return 0;
  let matches = 0;
  for (const word of wordsA) {
    const idx = poolB.indexOf(word);
    if (idx !== -1) {
      matches++;
      poolB.splice(idx, 1);
    }
  }
  return matches / Math.max(wordsA.length, wordsOf(b).length);
}

function isExactMatch(question, userAnswer) {
  const candidates = [question.answer, ...(question.acceptedAnswers || [])];
  return candidates.some((c) => normalize(c) === normalize(userAnswer));
}

// Cambridge da 2 puntos por una key word transformation totalmente correcta
// y 1 punto si la respuesta demuestra haber entendido la transformación (usa
// la palabra clave correctamente) pero tiene algún error. Esto es una
// aproximación automática de ese criterio, no un juicio de examinador real.
function scoreKeyWordTransformation(question, userAnswer, pointsPerItem) {
  if (isExactMatch(question, userAnswer)) {
    return { correct: true, partial: false, pointsAwarded: pointsPerItem };
  }
  if (!normalize(userAnswer)) {
    return { correct: false, partial: false, pointsAwarded: 0 };
  }

  const candidates = [question.answer, ...(question.acceptedAnswers || [])];
  const keyword = question.keyword ? normalize(question.keyword) : null;
  const keywordPresent = keyword ? wordsOf(userAnswer).includes(keyword) : true;

  let bestRatio = 0;
  for (const candidate of candidates) {
    bestRatio = Math.max(bestRatio, wordOverlapRatio(userAnswer, candidate));
  }

  const partial = keywordPresent && bestRatio >= 0.5;
  return { correct: false, partial, pointsAwarded: partial ? Math.floor(pointsPerItem / 2) : 0 };
}

function scoreQuestion(question, userAnswer, part, pointsPerItem) {
  if (part.type === 'key-word-transformation') {
    return scoreKeyWordTransformation(question, userAnswer, pointsPerItem);
  }
  const correct = isExactMatch(question, userAnswer);
  return { correct, partial: false, pointsAwarded: correct ? pointsPerItem : 0 };
}

// Puntos por ítem correcto en el Reading and Use of English de Cambridge C1
// Advanced: Parts 1, 2, 3 y 8 valen 1 punto; Parts 4, 5, 6 y 7 valen 2 puntos.
const DEFAULT_PART_POINTS = { 1: 1, 2: 1, 3: 1, 4: 2, 5: 2, 6: 2, 7: 2, 8: 1 };

// Puntos de anclaje (porcentaje medio de las 5 destrezas -> Cambridge English
// Scale) tomados de la tabla oficial de conversión del C1 Advanced.
const CS_ANCHORS = [
  { pct: 45, score: 160 },
  { pct: 60, score: 180 },
  { pct: 75, score: 193 },
  { pct: 80, score: 200 },
  { pct: 100, score: 210 },
];

function percentageToCambridgeScale(pct) {
  if (pct < CS_ANCHORS[0].pct) {
    return { score: null, grade: 'Por debajo de B2 (Suspenso)' };
  }
  let score = CS_ANCHORS[CS_ANCHORS.length - 1].score;
  for (let i = 0; i < CS_ANCHORS.length - 1; i++) {
    const lower = CS_ANCHORS[i];
    const upper = CS_ANCHORS[i + 1];
    if (pct >= lower.pct && pct <= upper.pct) {
      const ratio = (pct - lower.pct) / (upper.pct - lower.pct);
      score = Math.round(lower.score + ratio * (upper.score - lower.score));
      break;
    }
  }
  let grade;
  if (score >= 200) grade = 'Grade A';
  else if (score >= 193) grade = 'Grade B';
  else if (score >= 180) grade = 'Grade C';
  else grade = 'Level B2 (Fail)';
  return { score, grade };
}

function round1(n) {
  return Math.round(n * 10) / 10;
}

function gradeExam(examId, answers) {
  const exam = loadExamRaw(examId);
  if (!exam) return null;

  const scoring = exam.scoring || {};
  const sectionsResult = {};
  let totalCorrect = 0;
  let totalQuestions = 0;
  const details = {};

  let totalPartial = 0;

  for (const [sectionKey, section] of Object.entries(exam.sections)) {
    let sectionCorrect = 0;
    let sectionPartial = 0;
    let sectionTotal = 0;
    let earnedPoints = 0;
    let maxRawPoints = 0;
    const sectionScoring = scoring[sectionKey];
    const partPoints = sectionScoring ? sectionScoring.partPoints || {} : null;

    for (const part of section.parts) {
      const pointsPerItem = partPoints
        ? partPoints[String(part.partNumber)] ?? DEFAULT_PART_POINTS[part.partNumber] ?? 1
        : 1;

      for (const question of part.questions) {
        sectionTotal++;
        totalQuestions++;
        maxRawPoints += pointsPerItem;

        const userAnswer = answers[question.id];
        const { correct, partial, pointsAwarded } = scoreQuestion(question, userAnswer, part, pointsPerItem);

        if (correct) {
          sectionCorrect++;
          totalCorrect++;
        } else if (partial) {
          sectionPartial++;
          totalPartial++;
        }
        earnedPoints += pointsAwarded;

        details[question.id] = {
          correct,
          partial,
          pointsAwarded,
          pointsPossible: pointsPerItem,
          userAnswer: userAnswer ?? '',
          correctAnswer: question.answer,
          explanation: question.explanation || null,
        };
      }
    }

    const percentage = maxRawPoints ? round1((earnedPoints / maxRawPoints) * 100) : 0;
    const nominalMax = sectionScoring ? sectionScoring.nominalMax : null;
    const nominalEarned = nominalMax !== null && maxRawPoints
      ? round1((earnedPoints / maxRawPoints) * nominalMax)
      : null;
    const passPercentage = sectionScoring ? sectionScoring.passPercentage : null;

    sectionsResult[sectionKey] = {
      title: section.title,
      correct: sectionCorrect,
      partial: sectionPartial,
      total: sectionTotal,
      earnedPoints,
      maxRawPoints,
      nominalMax,
      nominalEarned,
      percentage,
      passPercentage,
      passed: passPercentage !== null ? percentage >= passPercentage : null,
    };
  }

  let caeEstimate = null;
  if (exam.examType === 'cae') {
    const skillKeys = ['reading', 'useOfEnglish', 'listening'];
    const percentages = skillKeys
      .filter((k) => sectionsResult[k])
      .map((k) => sectionsResult[k].percentage);

    if (percentages.length) {
      const average = round1(percentages.reduce((a, b) => a + b, 0) / percentages.length);
      caeEstimate = {
        skillsIncluded: skillKeys.filter((k) => sectionsResult[k]),
        averagePercentage: average,
        ...percentageToCambridgeScale(average),
      };
    }
  }

  return {
    examId,
    totalCorrect,
    totalPartial,
    totalQuestions,
    percentage: totalQuestions ? Math.round((totalCorrect / totalQuestions) * 100) : 0,
    sections: sectionsResult,
    details,
    caeEstimate,
  };
}

/* ============================================================
   Puerto de views/index.ejs, views/exam.ejs y
   views/partials/question.ejs (renderizado por JS en vez de EJS)
   ============================================================ */
function withGap(s) {
  return (s || '').replace('___', '<span class="gap">_____</span>');
}

function renderQuestionHTML(question) {
  let html = `<div class="question" data-question-id="${escapeHtml(question.id)}">`;
  if (question.sentence1 && question.keyword) {
    html += `<div class="kwt-block highlight-zone">`
      + `<p class="kwt-sentence1"><strong class="kwt-number">${question.number}.</strong> ${escapeHtml(question.sentence1)}</p>`
      + `<p class="kwt-keyword-row"><span class="keyword-badge">${escapeHtml(question.keyword)}</span></p>`
      + `<p class="kwt-sentence2">${withGap(question.sentence2)}</p>`
      + `</div>`;
  } else {
    html += `<p class="question-prompt highlight-zone"><strong>${question.number}.</strong>`
      + `${question.prompt ? ' ' + escapeHtml(question.prompt) : ''}</p>`;
  }

  if (question.options && question.options.length) {
    html += `<div class="options">`;
    question.options.forEach((opt) => {
      html += `<label class="option">`
        + `<input type="radio" name="${escapeHtml(question.id)}" value="${escapeHtml(opt.label)}">`
        + `<span class="highlight-zone"><strong>${escapeHtml(opt.label)})</strong> ${escapeHtml(opt.text)}</span>`
        + `</label>`;
    });
    html += `</div>`;
  } else {
    html += `<input type="text" class="text-answer" name="${escapeHtml(question.id)}" autocomplete="off" placeholder="Escribe tu respuesta">`;
  }

  html += `<p class="feedback"></p>`;
  html += `</div>`;
  return html;
}

function renderExamPartHTML(part) {
  let html = `<div class="exam-part"><h3>Parte ${part.partNumber}</h3>`;
  html += `<p class="instructions">${escapeHtml(part.instructions)}</p>`;

  if (part.renderedText) {
    html += `<div class="reading-text highlight-zone">${part.renderedText}</div>`;
  } else if (part.text) {
    html += `<div class="reading-text highlight-zone">${part.text.replace(/\n/g, '<br>')}</div>`;
  }

  if (part.gapBank) {
    html += `<div class="paragraph-bank">`
      + `<p class="bank-hint">Haz clic en un hueco del texto y luego en el párrafo que crees que encaja. Si te equivocas, haz clic sobre el hueco relleno para vaciarlo.</p>`
      + `<div class="paragraph-options">`;
    part.gapBank.forEach((opt) => {
      html += `<button type="button" class="paragraph-option" data-letter="${escapeHtml(opt.label)}" data-text="${escapeHtml(opt.text)}">`
        + `<strong>${escapeHtml(opt.label)}</strong> ${escapeHtml(opt.text)}</button>`;
    });
    html += `</div></div>`;
  }

  if (!part.inlineQuestions) {
    html += `<div class="questions">`;
    part.questions.forEach((question) => {
      html += renderQuestionHTML(question);
    });
    html += `</div>`;
  }

  html += `</div>`;
  return html;
}

function renderExamSectionHTML(key, section, index) {
  let html = `<section id="section-${escapeHtml(key)}" class="exam-section ${index === 0 ? '' : 'hidden'}">`;
  html += `<div class="section-heading"><div><h2>${escapeHtml(section.title)}</h2>`;
  if (section.note) {
    html += `<p class="section-note">${escapeHtml(section.note)}</p>`;
  }
  html += `</div><button type="button" class="clear-highlights-btn" data-target="section-${escapeHtml(key)}">Borrar marcas</button></div>`;
  html += `<p class="highlight-hint">Selecciona texto para subrayarlo o resaltarlo. Haz clic sobre una marca para quitarla.</p>`;

  section.parts.forEach((part) => {
    html += renderExamPartHTML(part);
  });

  html += `</section>`;
  return html;
}

function renderExamViewHTML(exam) {
  const keys = Object.keys(exam.sections);
  const tabsHtml = keys
    .map((key, i) => `<button type="button" class="tab-btn ${i === 0 ? 'active' : ''}" data-target="section-${escapeHtml(key)}">${escapeHtml(exam.sections[key].title)}</button>`)
    .join('');
  const sectionsHtml = keys
    .map((key, i) => renderExamSectionHTML(key, exam.sections[key], i))
    .join('');

  return `
    <header class="app-header">
      <a href="#" id="back-link" class="back-link">&larr; Volver al menú</a>
      <h1>${escapeHtml(exam.title)}</h1>
    </header>
    <nav class="tabs">${tabsHtml}</nav>
    <form id="exam-form">
      <main class="container">${sectionsHtml}</main>
      <div class="submit-bar container">
        <button type="submit" id="submit-btn">Finalizar y corregir</button>
      </div>
    </form>
    <div id="results" class="container hidden"></div>
  `;
}

function renderHomeListHTML() {
  const exams = listExams();
  if (!exams.length) {
    return `<ul class="exam-list"><li class="empty">No hay exámenes disponibles todavía. Añade uno en data/exams/.</li></ul>`;
  }
  const items = exams.map((exam) => `
    <li class="exam-card">
      <a href="#" class="exam-link" data-exam-id="${escapeHtml(exam.id)}">
        <span class="exam-name">${escapeHtml(exam.title)}</span>
        ${exam.description ? `<span class="exam-desc">${escapeHtml(exam.description)}</span>` : ''}
      </a>
    </li>`).join('');
  return `<ul class="exam-list">${items}</ul>`;
}

/* ============================================================
   Puerto de public/js/highlight.js
   (dividido en: configuración global, una sola vez; y el cableado
   de los botones "Borrar marcas", que se debe repetir cada vez que
   se renderiza un examen porque esos botones son nuevos cada vez)
   ============================================================ */
const HIGHLIGHT_COLORS = [
  { key: 'yellow', label: 'amarillo' },
  { key: 'green', label: 'verde' },
  { key: 'pink', label: 'rosa' },
];

let highlightToolbar = null;

function createHighlightToolbar() {
  highlightToolbar = document.createElement('div');
  highlightToolbar.className = 'highlight-toolbar hidden';

  const underlineBtn = document.createElement('button');
  underlineBtn.type = 'button';
  underlineBtn.title = 'Subrayar';
  underlineBtn.textContent = 'Subrayar';
  underlineBtn.addEventListener('mousedown', (e) => e.preventDefault());
  underlineBtn.addEventListener('click', () => applyHighlightMark('user-underline'));
  highlightToolbar.appendChild(underlineBtn);

  HIGHLIGHT_COLORS.forEach((c) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.title = `Resaltar en ${c.label}`;
    btn.innerHTML = `<span class="swatch swatch-${c.key}"></span>`;
    btn.addEventListener('mousedown', (e) => e.preventDefault());
    btn.addEventListener('click', () => applyHighlightMark('user-highlight', c.key));
    highlightToolbar.appendChild(btn);
  });

  document.body.appendChild(highlightToolbar);
}

function hideHighlightToolbar() {
  if (highlightToolbar) highlightToolbar.classList.add('hidden');
}

function showHighlightToolbarAt(rect) {
  if (!highlightToolbar) createHighlightToolbar();
  highlightToolbar.classList.remove('hidden');
  const top = rect.top - highlightToolbar.offsetHeight - 8;
  const left = rect.left + rect.width / 2 - highlightToolbar.offsetWidth / 2;
  highlightToolbar.style.top = `${Math.max(8, top)}px`;
  highlightToolbar.style.left = `${Math.max(8, Math.min(left, window.innerWidth - highlightToolbar.offsetWidth - 8))}px`;
}

function getSelectionInZone() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || sel.rangeCount === 0) return null;
  const range = sel.getRangeAt(0);
  const node = range.commonAncestorContainer;
  const el = node.nodeType === 1 ? node : node.parentElement;
  const zone = el ? el.closest('.highlight-zone') : null;
  if (!zone) return null;
  return { sel, range };
}

function applyHighlightMark(className, colorKey) {
  const info = getSelectionInZone();
  if (!info) return;
  const { sel, range } = info;

  const span = document.createElement('span');
  span.className = colorKey ? `${className} ${colorKey}` : className;

  try {
    range.surroundContents(span);
  } catch (err) {
    const frag = range.extractContents();
    span.appendChild(frag);
    range.insertNode(span);
  }

  sel.removeAllRanges();
  hideHighlightToolbar();
}

function unwrapHighlightMark(mark) {
  const parent = mark.parentNode;
  while (mark.firstChild) parent.insertBefore(mark.firstChild, mark);
  parent.removeChild(mark);
  parent.normalize();
}

function initHighlightGlobalListeners() {
  document.addEventListener('mouseup', () => {
    const info = getSelectionInZone();
    if (!info) {
      hideHighlightToolbar();
      return;
    }
    const rect = info.range.getBoundingClientRect();
    if (rect.width === 0 && rect.height === 0) {
      hideHighlightToolbar();
      return;
    }
    showHighlightToolbarAt(rect);
  });

  document.addEventListener('mousedown', (e) => {
    if (highlightToolbar && !highlightToolbar.contains(e.target)) hideHighlightToolbar();
  });

  document.addEventListener('click', (e) => {
    const mark = e.target.closest('.user-highlight, .user-underline');
    if (!mark) return;
    if (window.getSelection().toString()) return;
    unwrapHighlightMark(mark);
  });
}

function wireClearHighlightsButtons(root) {
  root.querySelectorAll('.clear-highlights-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const zoneRoot = document.getElementById(btn.dataset.target);
      if (!zoneRoot) return;
      zoneRoot.querySelectorAll('.user-highlight, .user-underline').forEach(unwrapHighlightMark);
    });
  });
}

/* ============================================================
   Puerto de public/js/gapped-text.js
   (envuelto en una función para poder repetir el cableado cada
   vez que se renderiza un examen nuevo)
   ============================================================ */
function initGappedText(root) {
  root.querySelectorAll('.paragraph-bank').forEach((bank) => {
    const container = bank.closest('.exam-part');
    if (!container) return;

    const gapTargets = container.querySelectorAll('.gap-target');
    const optionButtons = bank.querySelectorAll('.paragraph-option');
    const hint = bank.querySelector('.bank-hint');
    let activeGap = null;

    function setActiveGap(gap) {
      gapTargets.forEach((g) => g.classList.remove('active'));
      activeGap = gap;
      if (gap) gap.classList.add('active');
    }

    function updateOptionAvailability() {
      const used = new Set();
      gapTargets.forEach((g) => {
        if (g.dataset.filledLetter) used.add(g.dataset.filledLetter);
      });
      optionButtons.forEach((btn) => {
        const isUsed = used.has(btn.dataset.letter);
        btn.classList.toggle('used', isUsed);
        btn.disabled = isUsed;
      });
    }

    function fillGap(gap, letter, text) {
      gap.dataset.filledLetter = letter;
      gap.querySelector('.gap-target-label').classList.add('hidden');
      const contentEl = gap.querySelector('.gap-target-content');
      contentEl.textContent = `${letter}) ${text}`;
      contentEl.classList.remove('hidden');
      gap.querySelector('input[type="hidden"]').value = letter;
      gap.classList.add('filled');
      updateOptionAvailability();
    }

    function clearGap(gap) {
      delete gap.dataset.filledLetter;
      gap.querySelector('.gap-target-label').classList.remove('hidden');
      const contentEl = gap.querySelector('.gap-target-content');
      contentEl.textContent = '';
      contentEl.classList.add('hidden');
      gap.querySelector('input[type="hidden"]').value = '';
      gap.classList.remove('filled');
      updateOptionAvailability();
    }

    gapTargets.forEach((gap) => {
      gap.addEventListener('click', () => {
        if (gap.classList.contains('filled')) {
          clearGap(gap);
          setActiveGap(null);
          return;
        }
        setActiveGap(gap === activeGap ? null : gap);
      });
    });

    optionButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        if (btn.disabled) return;
        if (!activeGap) {
          if (hint) {
            hint.classList.add('shake');
            setTimeout(() => hint.classList.remove('shake'), 400);
          }
          return;
        }
        fillGap(activeGap, btn.dataset.letter, btn.dataset.text);
        setActiveGap(null);
      });
    });
  });
}

/* ============================================================
   Puerto de public/js/exam.js
   ============================================================ */
function showResults(result, root) {
  root.querySelectorAll('.question').forEach((qEl) => {
    const qId = qEl.dataset.questionId;
    const detail = result.details[qId];
    if (!detail) return;

    qEl.classList.remove('correct', 'partial', 'incorrect');
    const state = detail.correct ? 'correct' : detail.partial ? 'partial' : 'incorrect';
    qEl.classList.add(state);

    const feedback = qEl.querySelector('.feedback');
    const isCompact = qEl.classList.contains('inline-question') || qEl.classList.contains('gap-target');
    const pointsNote = detail.pointsPossible > 1 ? ` (${detail.pointsAwarded}/${detail.pointsPossible} puntos)` : '';

    if (isCompact) {
      feedback.textContent = state === 'correct' ? '✓' : state === 'partial' ? '≈' : '✗';
      feedback.title = state === 'correct'
        ? `Correcto${pointsNote}`
        : state === 'partial'
          ? `Parcialmente correcto${pointsNote} — Respuesta modelo: ${detail.correctAnswer}`
          : `Incorrecto — Respuesta correcta: ${detail.correctAnswer}`;

      const existingExplanation = qEl.querySelector('.gap-explanation');
      if (existingExplanation) existingExplanation.remove();

      if (qEl.classList.contains('inline-question') && state !== 'correct') {
        const explEl = document.createElement('span');
        explEl.className = 'gap-explanation';
        const intro = state === 'partial' ? 'Casi correcto.' : 'Incorrecto.';
        explEl.innerHTML = `<strong>${intro}</strong> Respuesta correcta: <strong>${detail.correctAnswer}</strong>.`
          + (detail.explanation ? ` ${detail.explanation}` : '');
        qEl.appendChild(explEl);
      }
    } else {
      feedback.textContent = state === 'correct'
        ? `✓ Correcto${pointsNote}`
        : state === 'partial'
          ? `≈ Parcialmente correcto${pointsNote} — Respuesta modelo: ${detail.correctAnswer}`
          : `✗ Incorrecto — Respuesta correcta: ${detail.correctAnswer}`;
    }
  });

  const resultsEl = root.querySelector('#results');
  resultsEl.classList.remove('hidden');

  const partialNote = result.totalPartial ? ` (+${result.totalPartial} parciales)` : '';
  let html = `<h2>Resultados</h2>
    <p class="score-total">Puntuación total: ${result.totalCorrect} / ${result.totalQuestions} (${result.percentage}%)${partialNote}</p>
    <ul class="score-breakdown">`;

  for (const key in result.sections) {
    const s = result.sections[key];
    const hasScoring = s.nominalMax !== null && s.nominalMax !== undefined;
    let line = `<li><strong>${s.title}:</strong> ${s.correct} / ${s.total} ítems`;
    if (s.partial) line += ` (+${s.partial} parciales)`;
    if (hasScoring) {
      line += ` &middot; ${s.earnedPoints} / ${s.maxRawPoints} puntos brutos`
        + ` &middot; ${s.nominalEarned} / ${s.nominalMax} (nota oficial Cambridge)`
        + ` &middot; ${s.percentage}%`;
      if (s.passPercentage !== null) {
        line += ` <span class="pass-badge ${s.passed ? 'pass' : 'fail'}">${s.passed ? 'Apto' : 'No apto'} (mín. ${s.passPercentage}%)</span>`;
      }
    } else {
      line += ` &middot; ${s.percentage ?? Math.round((s.correct / s.total) * 100)}%`;
    }
    line += '</li>';
    html += line;
  }
  html += '</ul>';

  if (result.caeEstimate) {
    html += renderCaeEstimate(result.caeEstimate);
  }

  resultsEl.innerHTML = html;

  if (result.caeEstimate) {
    wireCaeEstimateForm(result.caeEstimate, resultsEl);
  }

  resultsEl.scrollIntoView({ behavior: 'smooth' });
}

function renderCaeEstimate(estimate) {
  const scoreText = estimate.score ?? '—';
  return `
    <div class="cae-estimate">
      <h3>Estimación de nota — Cambridge C1 Advanced</h3>
      <p class="cae-note">
        Media de Reading + Use of English + Listening: <strong>${estimate.averagePercentage}%</strong>
        &rarr; Cambridge Scale Score estimado: <strong>${scoreText}</strong>
        &rarr; <strong>${estimate.grade}</strong>
        (provisional — esta app no corrige Writing ni Speaking, que suponen el otro 40% de la nota real, así que el resultado final puede cambiar).
      </p>
      <p class="cae-note">Si ya tienes esas notas (de tu profesor u otra corrección), introduce el porcentaje para calcular la estimación completa de las 5 destrezas:</p>
      <div class="cae-inputs">
        <label>Writing (%)
          <input type="number" id="writing-pct" min="0" max="100" step="0.1" placeholder="ej. 80">
        </label>
        <label>Speaking (%)
          <input type="number" id="speaking-pct" min="0" max="100" step="0.1" placeholder="ej. 68">
        </label>
        <button type="button" id="calc-cae-btn">Calcular nota completa</button>
      </div>
      <p id="cae-final-result" class="cae-final"></p>
    </div>`;
}

function wireCaeEstimateForm(estimate, resultsEl) {
  const btn = resultsEl.querySelector('#calc-cae-btn');
  const out = resultsEl.querySelector('#cae-final-result');
  if (!btn) return;

  btn.addEventListener('click', () => {
    const writingEl = resultsEl.querySelector('#writing-pct');
    const speakingEl = resultsEl.querySelector('#speaking-pct');
    const writing = writingEl.value !== '' ? parseFloat(writingEl.value) : null;
    const speaking = speakingEl.value !== '' ? parseFloat(speakingEl.value) : null;

    // El bloque R+UoE+L ya es la media de 3 destrezas con el mismo peso, así
    // que lo contamos como 3 al combinarlo con Writing y Speaking (1 cada una).
    let sum = estimate.averagePercentage * 3;
    let count = 3;
    if (writing !== null && !Number.isNaN(writing)) { sum += writing; count += 1; }
    if (speaking !== null && !Number.isNaN(speaking)) { sum += speaking; count += 1; }
    const average = Math.round((sum / count) * 10) / 10;

    const scale = percentageToCambridgeScale(average);
    const complete = count === 5;

    out.innerHTML = `Media ${complete ? 'final (5 destrezas)' : `provisional (${count} destrezas)`}: <strong>${average}%</strong>
      &rarr; Cambridge Scale Score estimado: <strong>${scale.score ?? '—'}</strong> &rarr; <strong>${scale.grade}</strong>
      ${!complete ? '<br><span class="cae-note">Añade Writing y Speaking para la estimación completa.</span>' : ''}`;
  });
}

/* ============================================================
   Navegación de la SPA: menú principal <-> vista de examen
   ============================================================ */
const homeView = document.getElementById('home-view');
const examView = document.getElementById('exam-view');
const examListContainer = document.getElementById('exam-list-container');

function showHome() {
  examView.classList.add('hidden');
  examView.innerHTML = '';
  homeView.classList.remove('hidden');
}

function openExam(examId) {
  const exam = getExam(examId);
  if (!exam) {
    alert('Examen no encontrado');
    return;
  }
  prepareExamForRender(exam);

  examView.innerHTML = renderExamViewHTML(exam);
  homeView.classList.add('hidden');
  examView.classList.remove('hidden');
  window.scrollTo(0, 0);

  wireExamView(examId);
}

function wireExamView(examId) {
  const backLink = examView.querySelector('#back-link');
  backLink.addEventListener('click', (e) => {
    e.preventDefault();
    showHome();
  });

  const tabs = examView.querySelectorAll('.tab-btn');
  const sections = examView.querySelectorAll('.exam-section');
  tabs.forEach((btn) => {
    btn.addEventListener('click', () => {
      tabs.forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      sections.forEach((s) => s.classList.add('hidden'));
      document.getElementById(btn.dataset.target).classList.remove('hidden');
    });
  });

  const form = examView.querySelector('#exam-form');
  form.addEventListener('submit', (e) => {
    e.preventDefault();

    const answers = {};
    new FormData(form).forEach((value, key) => {
      answers[key] = value;
    });

    const submitBtn = examView.querySelector('#submit-btn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Corrigiendo...';

    try {
      const result = gradeExam(examId, answers);
      if (!result) throw new Error('No se pudo corregir el examen');
      showResults(result, examView);
    } catch (err) {
      alert(err.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Finalizar y corregir';
    }
  });

  wireClearHighlightsButtons(examView);
  initGappedText(examView);
}

function renderHome() {
  examListContainer.innerHTML = renderHomeListHTML();
  examListContainer.querySelectorAll('.exam-link').forEach((link) => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      openExam(link.dataset.examId);
    });
  });
}

document.addEventListener('DOMContentLoaded', () => {
  initHighlightGlobalListeners();
  renderHome();
});
</script>
