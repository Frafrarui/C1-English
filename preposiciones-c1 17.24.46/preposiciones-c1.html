<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preposiciones C1</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  /* Premium Light Mode */
  --bg-gradient: linear-gradient(135deg, #f6f8fd 0%, #f1f6f9 100%);
  --surface: rgba(255, 255, 255, 0.7);
  --surface-solid: #ffffff;
  --surface-hover: rgba(255, 255, 255, 0.9);
  --border: rgba(255, 255, 255, 0.5);
  --border-solid: rgba(0, 0, 0, 0.08);
  --border2: rgba(0, 0, 0, 0.15); /* For compatibility with JS inline styles if any */

  --text: #1e293b;
  --text-muted: #64748b;
  --text-lighter: #94a3b8;
  --text2: #64748b; /* JS compat */
  --text3: #94a3b8; /* JS compat */

  --accent: #6366f1; /* Indigo */
  --accent-hover: #4f46e5;
  --accent-light: rgba(99, 102, 241, 0.1);
  --accent-text: #4338ca;
  --accent-t: #4338ca; /* JS compat */
  --accent-l: rgba(99, 102, 241, 0.1); /* JS compat */

  --success-bg: rgba(34, 197, 94, 0.1);
  --success-text: #15803d;
  --success-border: rgba(34, 197, 94, 0.3);
  --green-b: rgba(34, 197, 94, 0.1); /* JS compat */
  --green-t: #15803d; /* JS compat */

  --danger-bg: rgba(239, 68, 68, 0.1);
  --danger-text: #b91c1c;
  --danger-border: rgba(239, 68, 68, 0.3);
  --red-b: rgba(239, 68, 68, 0.1); /* JS compat */
  --red-t: #b91c1c; /* JS compat */

  --warning-bg: rgba(245, 158, 11, 0.1);
  --warning-text: #b45309;
  --amber-b: rgba(245, 158, 11, 0.1); /* JS compat */
  --amber-t: #b45309; /* JS compat */

  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --r: 8px; /* JS compat */
  --rlg: 16px; /* JS compat */

  --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
  --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
  --shadow-glass: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
}

@media(prefers-color-scheme: dark) {
  :root {
    /* Premium Dark Mode */
    --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    --surface: rgba(30, 41, 59, 0.6);
    --surface-solid: #1e293b;
    --surface-hover: rgba(30, 41, 59, 0.9);
    --border: rgba(255, 255, 255, 0.05);
    --border-solid: rgba(255, 255, 255, 0.1);
    --border2: rgba(255, 255, 255, 0.15); /* JS compat */

    --text: #f8fafc;
    --text-muted: #94a3b8;
    --text-lighter: #64748b;
    --text2: #94a3b8; /* JS compat */
    --text3: #64748b; /* JS compat */

    --accent: #818cf8;
    --accent-hover: #6366f1;
    --accent-light: rgba(129, 140, 248, 0.15);
    --accent-text: #c7d2fe;
    --accent-t: #c7d2fe; /* JS compat */
    --accent-l: rgba(129, 140, 248, 0.15); /* JS compat */

    --success-bg: rgba(74, 222, 128, 0.15);
    --success-text: #4ade80;
    --success-border: rgba(74, 222, 128, 0.3);
    --green-b: rgba(74, 222, 128, 0.15); /* JS compat */
    --green-t: #4ade80; /* JS compat */

    --danger-bg: rgba(248, 113, 113, 0.15);
    --danger-text: #f87171;
    --danger-border: rgba(248, 113, 113, 0.3);
    --red-b: rgba(248, 113, 113, 0.15); /* JS compat */
    --red-t: #f87171; /* JS compat */

    --warning-bg: rgba(251, 191, 36, 0.15);
    --warning-text: #fbbf24;
    --amber-b: rgba(251, 191, 36, 0.15); /* JS compat */
    --amber-t: #fbbf24; /* JS compat */

    --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
  }
}

body {
  font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
  padding: 3rem 1.5rem 6rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.page {
  max-width: 820px;
  margin: 0 auto;
}

header {
  margin-bottom: 3rem;
  text-align: center;
  animation: fadeInDown 0.6s ease-out;
}

header h1 {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin-bottom: 8px;
  background: linear-gradient(90deg, var(--accent), #a855f7);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

header p {
  font-size: 16px;
  color: var(--text-muted);
  font-weight: 400;
}

/* Glassmorphism utilities */
.glass {
  background: var(--surface);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-glass);
}

/* TABS */
.tabs {
  display: inline-flex;
  gap: 6px;
  padding: 6px;
  border-radius: 100px;
  margin-bottom: 2.5rem;
  position: relative;
  left: 50%;
  transform: translateX(-50%);
  animation: fadeIn 0.8s ease-out;
}

.tab {
  padding: 10px 28px;
  border-radius: 100px;
  border: none;
  background: transparent;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  color: var(--text-muted);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  font-family: inherit;
}

.tab:hover {
  color: var(--text);
  background: rgba(100, 100, 100, 0.1);
}

.tab.active {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
}

.section {
  display: none;
  animation: fadeIn 0.4s ease-out;
}
.section.active {
  display: block;
}

/* TEST SELECTOR */
.test-selector { margin-bottom: 2rem; }
.test-selector h2 {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-muted);
  margin-bottom: 16px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.test-btns {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}

.test-btn {
  padding: 20px;
  border-radius: var(--radius-md);
  background: var(--surface-solid);
  border: 1px solid var(--border-solid);
  font-family: inherit;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  color: var(--text);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  text-align: left;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  gap: 6px;
  overflow: hidden;
}

.test-btn::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(135deg, transparent, rgba(255,255,255,0.05));
  opacity: 0;
  transition: opacity 0.3s;
}

.test-btn:hover {
  transform: translateY(-4px);
  border-color: var(--accent);
  box-shadow: var(--shadow-md);
}

.test-btn:hover::before { opacity: 1; }

.test-btn.active {
  background: var(--accent);
  color: #fff;
  border-color: transparent;
}

.test-btn.done {
  border-color: var(--success-text);
  background: linear-gradient(145deg, var(--surface-solid), var(--success-bg));
}
.test-btn.done strong::after {
  content: '✓';
  margin-left: 8px;
  color: var(--success-text);
}

.test-btn .test-range {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
  display: block;
}
.test-btn.done .test-range { opacity: 0.8; }

/* QUIZ */
.quiz-wrap {
  max-width: 640px;
  margin: 0 auto;
}

.quiz-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.5rem;
}

.quiz-title { font-size: 18px; font-weight: 800; color: var(--text); }
.quiz-sub { font-size: 13px; color: var(--text-muted); font-weight: 500; }

.progress-row {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 2rem;
  background: var(--surface-solid);
  padding: 12px 20px;
  border-radius: 100px;
  border: 1px solid var(--border-solid);
  box-shadow: var(--shadow-sm);
}

.progress-label {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-muted);
  white-space: nowrap;
  min-width: 60px;
}

.progress-track {
  flex: 1;
  height: 8px;
  background: rgba(0,0,0,0.05);
  border-radius: 100px;
  overflow: hidden;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
}
@media(prefers-color-scheme: dark) {
  .progress-track { background: rgba(255,255,255,0.05); }
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), #a855f7);
  border-radius: 100px;
  transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

.progress-score {
  font-size: 14px;
  font-weight: 800;
  color: var(--accent);
  min-width: 48px;
  text-align: right;
}

.q-card {
  background: var(--surface-solid);
  border: 1px solid var(--border-solid);
  border-radius: var(--radius-lg);
  padding: 2.5rem 2rem;
  margin-bottom: 1.5rem;
  box-shadow: var(--shadow-md);
  text-align: center;
  animation: slideUp 0.4s ease-out;
}

.q-label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 16px;
  display: inline-block;
  padding: 4px 12px;
  background: var(--accent-light);
  border-radius: 100px;
}

.q-sentence {
  font-size: 22px;
  line-height: 1.6;
  font-weight: 500;
  color: var(--text);
}

.blank {
  display: inline-block;
  min-width: 80px;
  padding: 0 8px;
  border-bottom: 3px solid var(--accent);
  color: var(--accent);
  font-weight: 800;
  text-align: center;
  transition: all 0.3s;
  margin: 0 4px;
}

.q-note {
  font-size: 14px;
  color: var(--text-muted);
  margin-top: 16px;
  font-style: italic;
}

.multi-note {
  font-size: 13px;
  font-weight: 600;
  color: var(--warning-text);
  background: var(--warning-bg);
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  margin-top: 16px;
  display: inline-block;
}

.opts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 1.5rem;
  animation: fadeIn 0.6s ease-out;
}

.opt {
  padding: 18px;
  border-radius: var(--radius-md);
  border: 2px solid var(--border-solid);
  background: var(--surface-solid);
  font-family: inherit;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  color: var(--text);
  text-align: center;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: var(--shadow-sm);
}

.opt:hover:not(:disabled) {
  background: var(--surface-hover);
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.opt:active:not(:disabled) {
  transform: translateY(0);
}

.opt:disabled { cursor: default; }

.opt.correct {
  background: var(--success-bg);
  color: var(--success-text);
  border-color: var(--success-border);
  box-shadow: none;
}

.opt.wrong {
  background: var(--danger-bg);
  color: var(--danger-text);
  border-color: var(--danger-border);
  box-shadow: none;
  opacity: 0.8;
}

.feedback {
  margin-top: 20px;
  font-size: 16px;
  font-weight: 700;
  min-height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.3s;
}
.feedback.show { opacity: 1; transform: translateY(0); }

.feedback.ok { color: var(--success-text); opacity: 1; transform: translateY(0); }
.feedback.ko { color: var(--danger-text); opacity: 1; transform: translateY(0); }

.expl {
  margin-top: 16px;
  padding: 16px 20px;
  background: var(--accent-light);
  border-radius: var(--radius-md);
  border: 1px solid rgba(99, 102, 241, 0.2);
  font-size: 14px;
  font-weight: 500;
  color: var(--accent-text);
  line-height: 1.6;
  display: none;
  animation: slideUp 0.3s ease-out;
}
.expl.show { display: block; }

.next-row {
  text-align: center;
  margin-top: 24px;
}

/* RESULT */
.result-card {
  background: var(--surface-solid);
  border: 1px solid var(--border-solid);
  border-radius: var(--radius-lg);
  padding: 4rem 2rem;
  text-align: center;
  box-shadow: var(--shadow-md);
  animation: zoomIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.result-emoji {
  font-size: 72px;
  margin-bottom: 20px;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
}

.result-score {
  font-size: 48px;
  font-weight: 800;
  color: var(--accent);
  margin-bottom: 8px;
  line-height: 1;
}

.result-msg {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 12px;
}

.result-perfect {
  font-size: 14px;
  color: var(--success-text);
  font-weight: 700;
  margin-bottom: 30px;
  display: inline-block;
  padding: 6px 16px;
  background: var(--success-bg);
  border-radius: 100px;
}

.result-btns {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 30px;
}

/* BUTTONS */
button {
  padding: 12px 24px;
  border-radius: 100px;
  border: 1px solid var(--border-solid);
  background: var(--surface-solid);
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  color: var(--text);
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: var(--shadow-sm);
}

button:hover {
  background: var(--surface-hover);
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

button:active {
  transform: translateY(0);
}

.btn-primary {
  background: var(--accent);
  color: #fff;
  border-color: transparent;
}

.btn-primary:hover {
  background: var(--accent-hover);
  color: #fff;
}

.btn-green {
  background: #22c55e;
  color: #fff;
  border-color: transparent;
}
.btn-green:hover { background: #16a34a; }

.btn-red {
  background: var(--danger-bg);
  color: var(--danger-text);
  border-color: transparent;
}
.btn-red:hover { background: rgba(239, 68, 68, 0.2); }


/* FLASHCARDS */
#scene {
  perspective: 1200px;
  height: 260px;
  cursor: pointer;
  margin-bottom: 2rem;
  max-width: 520px;
  margin-left: auto;
  margin-right: auto;
}

#flipper {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

.card-face {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2.5rem;
  text-align: center;
  gap: 12px;
}

.card-front {
  background: var(--surface-solid);
  border: 1px solid var(--border-solid);
}

.flipped #flipper {
  transform: rotateY(180deg);
}

.card-back {
  background: linear-gradient(135deg, var(--accent), #a855f7);
  border: none;
  transform: rotateY(180deg);
  color: #fff;
}

.fc-cat-badge {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 800;
  padding: 4px 12px;
  border-radius: 100px;
}

.card-front .fc-cat-badge {
  color: var(--accent);
  background: var(--accent-light);
}

.card-back .fc-cat-badge {
  color: #fff;
  background: rgba(255,255,255,0.2);
}

.fc-word {
  font-size: 36px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--text);
}

.fc-prep {
  font-size: 52px;
  font-weight: 800;
  font-family: Georgia, serif;
  line-height: 1;
  color: #fff;
  text-shadow: 0 4px 12px rgba(0,0,0,0.1);
}

.fc-note {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-muted);
}

.fc-eg {
  font-size: 15px;
  font-style: italic;
  font-weight: 500;
  color: rgba(255,255,255,0.9);
  margin-top: 8px;
  line-height: 1.5;
}

.filter-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 2rem;
}

/* We provide custom CSS for filter-btn so app.js inline styles look ok, or override them */
.filter-btn {
  padding: 8px 18px !important;
  border-radius: 100px !important;
  border: 1px solid var(--border-solid) !important;
  font-size: 13px !important;
  font-weight: 600 !important;
  cursor: pointer !important;
  transition: all 0.2s !important;
  background: var(--surface-solid) !important;
  color: var(--text-muted) !important;
}

.filter-btn.active {
  background: var(--accent) !important;
  color: #fff !important;
  border-color: transparent !important;
  box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3) !important;
}

/* Animations */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Preposiciones dependientes C1</h1>
    <p>6 tests · ~40 preguntas · mezcla aleatoria de categorías</p>
  </header>

  <div class="tabs glass">
    <button class="tab active" onclick="showTab('tests',this)">Tests</button>
    <button class="tab" onclick="showTab('flash',this)">Flashcards</button>
  </div>

  <!-- TESTS -->
  <div id="sec-tests" class="section active">
    <div class="test-selector">
      <h2>Selecciona un test</h2>
      <div class="test-btns" id="test-btns"></div>
    </div>

    <div id="quiz-area" style="display:none">
      <div class="quiz-wrap">
        <div class="quiz-header">
          <div>
            <div class="quiz-title" id="quiz-title"></div>
            <div class="quiz-sub" id="quiz-sub"></div>
          </div>
          <button onclick="backToSelector()">← Volver</button>
        </div>

        <div class="progress-row">
          <span class="progress-label" id="pr-label">0 / 0</span>
          <div class="progress-track"><div class="progress-fill" id="pr-fill" style="width:0%"></div></div>
          <span class="progress-score" id="pr-score">—</span>
        </div>

        <div id="quiz-root"></div>
      </div>
    </div>
  </div>

  <!-- FLASHCARDS -->
  <div id="sec-flash" class="section">
    <div style="max-width:560px;margin:0 auto;">
      <div class="filter-row" id="fc-filters"></div>
      <p style="font-size:13px;color:var(--text-muted);text-align:center;margin-bottom:16px;font-weight:500;">Haz clic en la tarjeta para revelar la preposición</p>

      <div id="scene" onclick="flipCard()">
        <div id="flipper">
          <div class="card-face card-front">
            <div class="fc-cat-badge" id="fc-cat"></div>
            <div class="fc-word" id="fc-word"></div>
            <div class="fc-note" id="fc-note"></div>
          </div>
          <div class="card-face card-back">
            <div class="fc-cat-badge" id="fc-bcat"></div>
            <div class="fc-prep" id="fc-prep"></div>
            <div class="fc-eg" id="fc-eg"></div>
          </div>
        </div>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;padding:0 10px;">
        <div style="display:flex;gap:12px;">
          <button onclick="fcPrev()">← Anterior</button>
          <button onclick="fcNext()" class="btn-primary">Siguiente →</button>
        </div>
        <span style="font-size:14px;font-weight:700;color:var(--text-muted);" id="fc-prog">1 / 1</span>
      </div>
    </div>
  </div>
</div>

<script>
// Data and app logic embedded directly so this file works standalone (no server needed)

  {w:'hint',p:'at',c:'verb',s:'He hinted ___ a possible promotion.'},
  {w:'marvel',p:'at',c:'verb',s:'We marvelled ___ the view from the top.'},
  {w:'guess',p:'at',c:'verb',s:'I can only guess ___ her reasons.'},
  // ── VERB + AGAINST ──────────────────────────────────────────────────────────
  {w:'protest',p:'against',c:'verb',n:'manifestarse en contra',s:'Thousands marched ___ the new law.',expl:'protest AGAINST = manifestarse en contra · protest ABOUT = quejarse de algo'},
  {w:'insure',p:'against',c:'verb',s:'You should insure your home ___ flood damage.'},
];

// ── DUAL-PREP DETECTION ────────────────────────────────────────────────────
// Finds words (adj/verb) that appear with more than one preposition
const _prepMap = {};
CARDS.forEach(c => {
  if (c.c === 'adj' || c.c === 'verb') {
    if (!_prepMap[c.w]) _prepMap[c.w] = new Set();
    _prepMap[c.w].add(c.p);
  }
});
const multiPrepWords = new Set(Object.keys(_prepMap).filter(k => _prepMap[k].size > 1));

// ── RANDOM TEST GENERATION ─────────────────────────────────────────────────
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
}

function describeCards(cards) {
  const ct = {};
  cards.forEach(c => { ct[c.c] = (ct[c.c] || 0) + 1; });
  return ['adj','noun','expr','verb'].filter(k => ct[k]).map(k => `${ct[k]} ${k}`).join(' · ');
}

const TESTS_KEY = 'prep-c1-tests-v1';

function buildAndSaveTests() {
  const allIdx = CARDS.map((_, i) => i);
  shuffle(allIdx);
  const n = allIdx.length;
  const base = Math.floor(n / 6);
  const extra = n % 6;
  const groups = [];
  let pos = 0;
  for (let i = 0; i < 6; i++) {
    const sz = base + (i < extra ? 1 : 0);
    groups.push(allIdx.slice(pos, pos + sz));
    pos += sz;
  }
  localStorage.setItem(TESTS_KEY, JSON.stringify(groups));
  return groups;
}

function loadTests() {
  let groups = null;
  try {
    const stored = localStorage.getItem(TESTS_KEY);
    if (stored) {
      const parsed = JSON.parse(stored);
      // Validate: 6 groups, all indices valid, total = CARDS.length
      if (Array.isArray(parsed) && parsed.length === 6 &&
          parsed.flat().length === CARDS.length &&
          parsed.flat().every(i => i >= 0 && i < CARDS.length)) {
        groups = parsed;
      }
    }
  } catch(e) {}
  if (!groups) groups = buildAndSaveTests();
  return groups.map((idxArr, i) => {
    const cards = idxArr.map(j => CARDS[j]);
    return { id: i + 1, label: `Test ${i + 1}`, desc: describeCards(cards), cards };
  });
}

let TESTS = loadTests();

// ── STATE ──────────────────────────────────────────────────────────────────
const passed = {};
let currentTest = null;
let qDeck = [], qi = 0, score = 0, answered_count = 0, wrongCards = [];

// ── TEST SELECTOR ──────────────────────────────────────────────────────────
function buildSelector() {
  const el = document.getElementById('test-btns');
  el.innerHTML = '';
  TESTS.forEach(t => {
    const b = document.createElement('button');
    b.className = 'test-btn' + (passed[t.id] ? ' done' : '');
    b.innerHTML = `<strong>${t.label}</strong><span class="test-range">${t.desc} · ${t.cards.length} preguntas</span>`;
    b.onclick = () => startTest(t.id);
    el.appendChild(b);
  });
}

function startTest(id) {
  currentTest = TESTS.find(t => t.id === id);
  qDeck = [...currentTest.cards];
  shuffle(qDeck);
  qi = 0; score = 0; answered_count = 0; wrongCards = [];
  document.getElementById('quiz-title').textContent = currentTest.label;
  document.getElementById('quiz-sub').textContent = currentTest.cards.length + ' preguntas · responde todas para ver el resultado';
  document.getElementById('quiz-area').style.display = 'block';
  document.querySelector('.test-selector').style.display = 'none';
  updateProgress();
  renderQ();
}

function startWrongCards() {
  qDeck = [...wrongCards];
  shuffle(qDeck);
  qi = 0; score = 0; answered_count = 0; wrongCards = [];
  document.getElementById('quiz-title').textContent = currentTest.label + ' — Fallos';
  document.getElementById('quiz-sub').textContent = qDeck.length + ' preguntas falladas · vuelve a responderlas';
  updateProgress();
  renderQ();
}

function backToSelector() {
  document.getElementById('quiz-area').style.display = 'none';
  document.querySelector('.test-selector').style.display = 'block';
  buildSelector();
}

// ── QUIZ ───────────────────────────────────────────────────────────────────
function renderQ() {
  const c = qDeck[qi];
  const correct = c.p;
  const wrong = ALL_PREPS.filter(p => p !== correct);
  shuffle(wrong);
  const opts = [correct, wrong[0], wrong[1], wrong[2]];
  shuffle(opts);

  const sentHtml = c.s
    ? c.s.replace('___', '<span class="blank" id="blank">___</span>')
    : `${c.w} <span class="blank" id="blank">___</span> …`;

  const multiNote = multiPrepWords.has(c.w)
    ? `<div class="multi-note">⚠️ Esta palabra acepta más de una preposición según el contexto</div>`
    : '';

  const explHtml = c.expl
    ? `<div class="expl" id="expl">💡 ${c.expl}</div>`
    : `<div id="expl"></div>`;

  document.getElementById('quiz-root').innerHTML = `
    <div class="q-card">
      <div class="q-label">${CAT_LABELS[c.c]} · Pregunta ${qi + 1} de ${qDeck.length}</div>
      <div class="q-sentence">${sentHtml}</div>
      ${c.n ? `<div class="q-note">${c.n}</div>` : ''}
      ${multiNote}
    </div>
    <div class="opts">
      ${opts.map(o => `<button class="opt" onclick="answer(this,'${o}','${correct}')">${o}</button>`).join('')}
    </div>
    <div class="feedback" id="fb"></div>
    ${explHtml}
    <div class="next-row">
      <button class="btn-primary" onclick="nextQ()">Siguiente →</button>
    </div>
  `;
}

function answer(btn, chosen, correct) {
  if (document.querySelector('.opt:disabled')) return;
  answered_count++;
  document.getElementById('blank').textContent = chosen;
  document.querySelectorAll('.opt').forEach(b => b.disabled = true);
  const fb = document.getElementById('fb');
  if (chosen === correct) {
    btn.classList.add('correct'); score++;
    fb.textContent = '✓ Correcto'; fb.className = 'feedback ok';
  } else {
    btn.classList.add('wrong');
    fb.textContent = `✗ Era: ${correct}`; fb.className = 'feedback ko';
    document.querySelectorAll('.opt').forEach(b => { if (b.textContent === correct) b.classList.add('correct'); });
    wrongCards.push(qDeck[qi]);
  }
  // Always show expl after answering (dual-prep info or contextual note)
  const expl = document.getElementById('expl');
  if (expl && expl.textContent.trim()) expl.classList.add('show');
  updateProgress();
}

function nextQ() {
  qi++;
  if (qi >= qDeck.length) { showResult(); return; }
  renderQ();
}

function showResult() {
  const total = qDeck.length;
  const pct = Math.round(score / total * 100);
  const perfect = score === total;
  if (perfect) passed[currentTest.id] = true;
  const emoji = perfect ? '🏆' : pct >= 70 ? '📈' : '📚';
  const msg = perfect ? '¡Test superado! Puedes pasar al siguiente.' : pct >= 70 ? 'Casi — repite para conseguir el 100%.' : 'Repasa los patrones e inténtalo de nuevo.';

  document.getElementById('quiz-root').innerHTML = `
    <div class="result-card">
      <div class="result-emoji">${emoji}</div>
      <div class="result-score">${score} / ${total}</div>
      <div class="result-msg">${msg}</div>
      ${perfect ? `<div class="result-perfect">✓ Test ${currentTest.id} completado al 100%</div>` : ''}
      <div class="result-btns">
        <button class="btn-primary" onclick="startTest(${currentTest.id})">Repetir test</button>
        ${wrongCards.length > 0 ? `<button class="btn-red" onclick="startWrongCards()">Repetir fallos (${wrongCards.length})</button>` : ''}
        <button onclick="backToSelector()">Ver todos los tests</button>
        ${perfect && currentTest.id < 6 ? `<button class="btn-green" onclick="startTest(${currentTest.id + 1})">Test ${currentTest.id + 1} →</button>` : ''}
      </div>
    </div>
  `;
  // Show final score in progress bar
  document.getElementById('pr-label').textContent = `${score} / ${total}`;
  document.getElementById('pr-fill').style.width = '100%';
  document.getElementById('pr-score').textContent = pct + '%';
}

function updateProgress() {
  const total = qDeck.length;
  const progress = total ? Math.round(answered_count / total * 100) : 0;
  const accuracy = answered_count ? Math.round(score / answered_count * 100) : null;
  document.getElementById('pr-label').textContent = `${answered_count} / ${total}`;
  document.getElementById('pr-fill').style.width = progress + '%';
  document.getElementById('pr-score').textContent = accuracy !== null ? accuracy + '%' : '—';
}

// ── FLASHCARDS ─────────────────────────────────────────────────────────────
let activeCats = new Set(['adj', 'noun', 'expr', 'verb']);
let deck = [], fi = 0;

function buildDeck() {
  deck = CARDS.filter(c => activeCats.has(c.c));
  shuffle(deck); fi = 0;
}

function showCard() {
  if (!deck.length) return;
  const c = deck[fi];
  document.getElementById('fc-cat').textContent = CAT_LABELS[c.c];
  document.getElementById('fc-word').textContent = c.w;
  document.getElementById('fc-note').textContent = c.n ? `(${c.n})` : '';
  document.getElementById('fc-bcat').textContent = CAT_LABELS[c.c];
  document.getElementById('fc-prep').textContent = c.p;
  document.getElementById('fc-eg').textContent = c.s ? c.s.replace('___', `[${c.p}]`) : `${c.w} ${c.p} …`;
  document.getElementById('fc-prog').textContent = `${fi + 1} / ${deck.length}`;
  document.getElementById('scene').classList.remove('flipped');
  document.getElementById('flipper').style.transform = '';
}

function flipCard() {
  const s = document.getElementById('scene');
  const f = document.getElementById('flipper');
  if (s.classList.contains('flipped')) {
    s.classList.remove('flipped'); f.style.transform = '';
  } else {
    s.classList.add('flipped'); f.style.transform = 'rotateY(180deg)';
  }
}

function fcNext() { fi = (fi + 1) % deck.length; showCard(); }
function fcPrev() { fi = (fi - 1 + deck.length) % deck.length; showCard(); }

function buildFilters() {
  const el = document.getElementById('fc-filters');
  Object.entries(CAT_LABELS).forEach(([k, v]) => {
    const b = document.createElement('button');
    b.className = 'filter-btn active';
    b.textContent = v;
    b.onclick = () => {
      if (activeCats.has(k)) {
        if (activeCats.size > 1) {
          activeCats.delete(k);
          b.classList.remove('active');
        }
      } else {
        activeCats.add(k);
        b.classList.add('active');
      }
      buildDeck(); showCard();
    };
    el.appendChild(b);
  });
}

function showTab(id, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('sec-' + id).classList.add('active');
  btn.classList.add('active');
}

// ── INIT ───────────────────────────────────────────────────────────────────
buildSelector();
buildFilters();
buildDeck();
showCard();
</script>
</body>
