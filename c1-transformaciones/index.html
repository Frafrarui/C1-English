<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C1 · Transformaciones</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ── Header ── -->
<header>
  <div class="logo">
    <div class="logo-c1">C1</div>
    <div class="logo-sub">Key word transformations</div>
  </div>
  <div class="header-stats">
    <div class="stat">
      <div class="stat-num gold">
        <span id="stat-score">0</span><span class="max" id="stat-maxscore">/20</span>
      </div>
      <div class="stat-label">Puntos</div>
    </div>
    <div class="stat">
      <div class="stat-num"><span id="stat-done">0</span>/<span id="stat-total">10</span></div>
      <div class="stat-label">Hechas</div>
    </div>
  </div>
</header>

<!-- ── Progress bar ── -->
<div class="progress-wrap">
  <div class="progress-track">
    <div class="progress-fill" id="progress"></div>
  </div>
</div>

<!-- ── Nav dots ── -->
<div class="nav-wrap" id="nav"></div>

<!-- ── Main content ── -->
<main>
  <div id="question-area"></div>
  <div class="summary" id="summary"></div>
</main>

<!-- ── Scripts ── -->
<!-- 1. Banco de preguntas -->
<script src="data/questions.js"></script>
<!-- 2. Lógica principal -->
<script src="js/app.js"></script>

</body>
</html>
